# app 里「标题 logo 不对」的报告 → 本仓库的标题 logo 修正请求 issue. 说明见 worker/README.md.
name = "bangumi-tmdb-map-report"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
REPO = "GrahamZen/bangumi-tmdb-map"

# 每个 IP 每分钟最多 5 次 (Workers 的限频绑定, period 只能是 10 或 60 秒)
[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# 每个 IP 每天、全站每天的计数 (见 src/index.js 开头)
[[kv_namespaces]]
binding = "REPORTS"
id = "09cd1f3fbb104855b438b4f3d94e2843"
