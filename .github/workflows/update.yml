# 每天跑一轮: 取 Bangumi 最新导出 → 挑出到期的条目 → 用 izuko-tv 的匹配器搜 TMDB → 结果提交回本仓库.
# 没有到期条目时在构建前就结束 (只花下载导出的一两分钟).
# 各步骤的逻辑在 scripts/ci.sh (本地用 `scripts/ci.sh local` 跑同一套); 这里只另外装 JDK、存取缓存与提交.
name: update

on:
  schedule:
    # UTC 22:30 = 北京时间 06:30. Bangumi 导出每周三 05:00 (北京时间) 前后更新
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      max_jobs:
        description: '本轮最多跑多少个条目 (实际由时限决定, 一轮约能跑四万)'
        default: '40000'
      ids:
        description: '只跑这些 bgm id (逗号分隔, 忽略到期规则; 调试用)'
        default: ''
      minutes:
        description: '匹配最多跑多少分钟 (之后不再开新任务, 剩下的下一轮接着跑)'
        default: '290'
      force:
        description: '全部重跑 (人工修正的除外); 匹配器或表的格式变了时用'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      MAX_JOBS: ${{ inputs.max_jobs || '40000' }}
      ONLY_IDS: ${{ inputs.ids || '' }}
      MATCH_MINUTES: ${{ inputs.minutes || '290' }}
      FORCE_ALL: ${{ inputs.force || false }}
    steps:
      # 取开跑时最新的 main, 而不是触发那一刻的提交: 排在前一轮后面的这一轮要接着它的结果往下合并
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download Bangumi Archive
        run: scripts/ci.sh download

      - name: Plan
        id: plan
        run: scripts/ci.sh plan

      - name: Checkout matcher (izuko-tv)
        if: steps.plan.outputs.jobs != '0'
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: scripts/ci.sh matcher

      - name: Install JBR
        if: steps.plan.outputs.jobs != '0'
        run: scripts/ci.sh jdk

      - uses: actions/cache/restore@v4
        if: steps.plan.outputs.jobs != '0'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ env.MATCHER_SHA }}
          restore-keys: gradle-${{ runner.os }}-

      # 超时或中途失败也继续往下合并: 结果逐条落盘, 已完成的不丢. 最后一步再把这一轮标成失败
      - name: Match
        id: match
        if: steps.plan.outputs.jobs != '0'
        continue-on-error: true
        timeout-minutes: 330
        run: scripts/ci.sh match

      - name: Merge
        id: merge
        if: steps.plan.outputs.jobs != '0'
        run: scripts/ci.sh merge

      - name: Commit
        if: steps.plan.outputs.jobs != '0' && steps.merge.outputs.skip != '1'
        run: |
          set -euo pipefail
          git add map state docs
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "update $(date -u +%F): $(cat "$RUNNER_TEMP/work/summary.txt")"
          # 跑的这几个小时里可能有人工修正推上来 (只动 overrides/), 叠在它上面再推; 修正由 apply-overrides 那一轮应用
          git pull -q --rebase origin main
          git push
          # jsDelivr 按分支缓存, 推完主动刷新
          for f in map/bgm-tmdb.tsv map/meta.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" > /dev/null || true
          done

      # 失败的那一轮也存: 下载的依赖与编译产物照样有用, 不然每次重试都是冷构建
      - uses: actions/cache/save@v4
        if: always() && steps.plan.outputs.jobs != '0'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ env.MATCHER_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        if: always() && steps.plan.outputs.jobs != '0'
        with:
          name: run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/work/plan.json
            ${{ runner.temp }}/work/results.jsonl
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail if matching failed
        if: steps.match.outcome == 'failure'
        run: |
          echo "::error::匹配那一步失败了 (构建失败或超时); 已完成的结果已经提交, 见上面 Match 的日志"
          exit 1
