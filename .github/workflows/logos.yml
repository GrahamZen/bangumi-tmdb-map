# 每天查一轮标题 logo: 对应表里的 TMDB 条目到期的 (没查过 / TMDB 上最近两天有改动 / 各语言齐的 60 天 / 缺语言的 14 天) 重新挑日、中、英与原语言的 logo,
# 存进 state/logos.tsv, 再按它重写对应表的 logo 列 (logo 修正一并应用). 逻辑在 scripts/logos.py 与 ci.sh 的 logos 步骤.
# 查详情时顺带取港台译名 (state/names.tsv), 重写对应表时一并写进 names 列; 还没取过译名的条目也算到期.
# 查 logo 的 /images 请求顺带取排第一的无字幕背景图 (state/backdrops.tsv), 当天不查 logo 的条目两周轮一遍, 重写对应表时改写 backdrop_path 列.
# 同一轮先从 bangumi-data 更新 AniDB 条目编号 (state/anidb.tsv, scripts/anidb.py), 重写对应表时一并写进 anidb 列.
name: logos

on:
  schedule:
    # UTC 20:40, 赶在每日匹配 (22:30) 之前跑完; 两边同一个 concurrency group, 撞上了就排队
    - cron: '40 20 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: '最多查多少分钟 (剩下的下一轮接着查)'
        default: '40'
      backdrop_quota:
        description: '只查背景图的条目这一轮至多几个 (空 = 条目数 / 14; 填个大数一轮查完)'
        default: ''

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update AniDB ids
        run: scripts/ci.sh anidb

      - name: Check logos
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          LOGO_MINUTES: ${{ inputs.minutes || '40' }}
          LOGO_BACKDROP_QUOTA: ${{ inputs.backdrop_quota || '0' }}
        run: scripts/ci.sh logos

      - name: Commit
        run: |
          set -euo pipefail
          git add map state docs
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "logos $(date -u +%F): $(cat "$RUNNER_TEMP/work/summary.txt")"
          git pull -q --rebase origin main
          git push
          for f in map/bgm-tmdb.tsv map/meta.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" > /dev/null || true
          done
